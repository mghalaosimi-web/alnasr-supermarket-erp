x-image: &alnasr-image
  image: alnasr-local:16
  pull_policy: never
  restart: unless-stopped
  platform: linux/amd64

x-site-volumes: &site-volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs

services:
  configurator:
    <<: *alnasr-image
    restart: "no"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
    volumes: *site-volumes
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *alnasr-image
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes: *site-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  frontend:
    <<: *alnasr-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-alnasr.local}
      NGINX_LISTEN_PORT: "8080"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes: *site-volumes
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PUBLISH_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *alnasr-image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: *site-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: *alnasr-image
    command: ["bench", "worker", "--queue", "short,default"]
    volumes: *site-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    <<: *alnasr-image
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes: *site-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *alnasr-image
    command: ["bench", "schedule"]
    volumes: *site-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Create deploy/.env with a strong DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Create deploy/.env with a strong DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
  caddy-data:
  caddy-config:
