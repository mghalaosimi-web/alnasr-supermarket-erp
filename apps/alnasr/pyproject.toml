[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "alnasr"
authors = [{ name = "AL-NASR" }]
description = "AL-NASR supermarket and retail operations extensions for Frappe"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "alnasr"
