name: AL-NASR local deployment validation

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".gitmodules"
      - "apps/alnasr/**"
      - "apps/xpos"
      - ".github/workflows/alnasr-deployment-validation.yml"
  push:
    branches:
      - "foundation/**"
    paths:
      - "deploy/**"
      - ".dockerignore"
      - ".gitmodules"
      - "apps/alnasr/**"
      - "apps/xpos"
      - ".github/workflows/alnasr-deployment-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration without pulling images
        env:
          DB_PASSWORD: ci-only-not-a-real-secret
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml config --format json > "$RUNNER_TEMP/alnasr-compose.resolved.json"
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "alnasr-compose.resolved.json"), encoding="utf-8") as handle:
              config = json.load(handle)
          assert config["services"]["frontend"]["ports"][0]["host_ip"] == "127.0.0.1"
          assert config["services"]["frontend"]["ports"][0]["published"] == "8080"
          assert config["services"]["backend"]["image"] == "alnasr-local:16"
          assert config["services"]["db"]["image"] == "mariadb:11.8"
          assert config["services"]["caddy"]["ports"][0]["host_ip"] == "127.0.0.1"
          assert config["services"]["caddy"]["ports"][0]["published"] == "443"
          print("Compose config valid; frontend is loopback-only; pinned local app image and MariaDB are present.")
          PY
      - name: Verify secrets and persistent data are excluded from Git
        run: |
          git check-ignore deploy/.env
          git check-ignore deploy/backups/example.sql.gz


  container-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify immutable upstream revisions
        run: bash scripts/bootstrap-upstream.sh
      - name: Build the local AL-NASR runtime image
        run: docker build --pull --file deploy/Dockerfile --tag alnasr-local:ci .
      - name: Verify app versions are importable in the image
        run: |
          docker run --rm --entrypoint bash alnasr-local:ci -lc 'bench version'
          docker run --rm --entrypoint bash alnasr-local:ci -lc '/home/frappe/frappe-bench/env/bin/python -c "import frappe, xpos, alnasr; print(\"Frappe\", frappe.__version__); print(\"X POS\", xpos.__version__); print(\"AL-NASR\", alnasr.__version__)"'


  windows-installer-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile AL-NASR Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          & $compiler "deploy/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "dist/installer/AL-NASR-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer output was not created." }
          Get-FileHash $installer -Algorithm SHA256 | Format-List | Out-File "dist/installer/SHA256SUMS.txt"
      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-NASR-Windows-Installer-Preview
          path: |
            dist/installer/AL-NASR-Setup.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  windows-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows lifecycle script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "deploy/windows/alnasr.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          Write-Host "PowerShell syntax parsed successfully."
