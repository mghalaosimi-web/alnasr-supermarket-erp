name: AL-NASR local deployment validation

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/alnasr-deployment-validation.yml"
  push:
    branches:
      - "foundation/**"
    paths:
      - "deploy/**"
      - ".github/workflows/alnasr-deployment-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration without pulling images
        env:
          DB_PASSWORD: ci-only-not-a-real-secret
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml config > "$RUNNER_TEMP/alnasr-compose.resolved.yaml"
          grep -F '127.0.0.1:8080:8080' "$RUNNER_TEMP/alnasr-compose.resolved.yaml"
          grep -F 'alnasr-local:16' "$RUNNER_TEMP/alnasr-compose.resolved.yaml"
      - name: Verify secrets and persistent data are excluded from Git
        run: |
          git check-ignore deploy/.env
          git check-ignore deploy/backups/example.sql.gz

  windows-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows lifecycle script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "deploy/windows/alnasr.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          Write-Host "PowerShell syntax parsed successfully."
