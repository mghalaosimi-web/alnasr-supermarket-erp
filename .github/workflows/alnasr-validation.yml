name: AL-NASR app validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: alnasr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-custom-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize and verify pinned upstream submodules
        run: bash scripts/bootstrap-upstream.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Validate project metadata
        working-directory: apps/alnasr
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project = data["project"]
          assert project["name"] == "alnasr"
          assert project["requires-python"] == ">=3.14,<3.15"
          assert data["tool"]["bench"]["frappe-dependencies"]["frappe"] == ">=16.55.0,<17.0.0"
          assert data["tool"]["bench"]["frappe-dependencies"]["erpnext"] == ">=16.55.0,<17.0.0"
          assert "frappe" not in project.get("dependencies", [])
          print("AL-NASR package metadata is valid.")
          PY

      - name: Set up Node.js for dashboard syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate AL-NASR Desk dashboard JavaScript syntax
        run: node --check apps/alnasr/alnasr/page/alnasr/alnasr.js

      - name: Compile Python sources
        run: python -m compileall -q apps/alnasr/alnasr

      - name: Run standard-library brand asset contract tests
        run: python -m unittest discover -s apps/alnasr/tests -v

      - name: Build source and wheel distributions
        working-directory: apps/alnasr
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check patch whitespace
        run: git diff --check
