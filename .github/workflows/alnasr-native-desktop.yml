name: AL-NASR native Windows desktop validation

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/alnasr-native-desktop.yml"
  push:
    branches:
      - architecture/native-windows-sqlite
    paths:
      - "desktop/**"
      - ".github/workflows/alnasr-native-desktop.yml"

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build Electron application
        run: npm run build
      - name: Build offline Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: AL-NASR-Native-Windows-Installer-Preview
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
