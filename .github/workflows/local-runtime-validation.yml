name: AL-NASR Local Runtime Validation

on:
  pull_request:
    branches:
      - foundation/alnasr-commerce-acceptance
    paths:
      - "local-app/**"
      - ".github/workflows/local-runtime-validation.yml"
  push:
    branches:
      - architecture/sqlite-offline-no-docker
    paths:
      - "local-app/**"
      - ".github/workflows/local-runtime-validation.yml"

permissions:
  contents: read

concurrency:
  group: alnasr-local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SQLite runtime typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
