name: AL-NASR Android client validation

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/alnasr-android-validation.yml"
  push:
    branches:
      - "foundation/**"
    paths:
      - "android/**"
      - ".github/workflows/alnasr-android-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - name: Upload debug APK for controlled device testing
        uses: actions/upload-artifact@v4
        with:
          name: AL-NASR-Android-Debug-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
